<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>リニー銀行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #EEF1F5;
    --bg-bottom: #D5DBE3;
    --text: #1F2328;
    --sub: #6B7280;
    --minus: #A63A22;
    --mint: #C8F3EA;
    --blue: #A9C8F5;
    --card: rgba(255,255,255,0.62);
    --tile: #FFFFFF;
    --line: #4B5563;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans JP', -apple-system, 'Hiragino Sans', sans-serif;
    color: var(--text);
    background: var(--bg-bottom);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .num { font-feature-settings: "tnum" 1; }

  /* 画面全体：上 #EEF1F5 → 下 #D5DBE3 */
  .app {
    position: relative;
    max-width: 430px; min-height: 100vh; min-height: 100dvh; margin: 0 auto;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    overflow: hidden;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }

  /* 1. ヘッダー */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(48px + env(safe-area-inset-top)) 4px 0 24px;
    height: calc(113px + env(safe-area-inset-top));
  }
  .stage { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
  .stage svg { width: 26px; height: 26px; }
  .head-icons { display: flex; gap: 2px; }
  .icon-btn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; }
  .icon-btn:active { background: rgba(0,0,0,.06); }
  .icon-btn svg { width: 24px; height: 24px; }

  /* 2. サブヘッダー */
  .subhead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 23px 0 24px; height: 28px; margin-top: 0;
    color: var(--sub); font-size: 14px;
  }
  .subhead button { display: flex; align-items: center; gap: 6px; color: var(--sub); min-height: 44px; }
  .subhead svg { width: 18px; height: 18px; }
  .refresh svg { transition: transform .6s ease; }
  .refresh.spin svg { transform: rotate(360deg); }

  /* 3. 残高エリア */
  .hero { position: relative; height: 226px; margin-top: 2px; }
  .orb {
    position: absolute; left: 50%; top: 1px; transform: translateX(-50%);
    width: 94%; aspect-ratio: 1 / 1; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(135deg, var(--mint) 0%, #B4E6F0 45%, var(--blue) 80%, #A9B8F0 100%);
    opacity: .9;
    pointer-events: none;
  }
  .hero-text { position: absolute; left: 0; right: 0; top: 82px; text-align: center; }
  .branch { font-size: 15px; font-weight: 400; letter-spacing: .01em; }
  .balance { margin-top: 4px; font-weight: 700; line-height: 1.15; }
  .balance .v { font-size: 31px; letter-spacing: .01em; }
  .balance .u { font-size: 18px; font-weight: 700; margin-left: 2px; }
  .diff { margin-top: 2px; font-size: 16px; }
  .diff .lbl { color: var(--text); margin-right: 8px; }
  .amt-minus { color: var(--minus); font-weight: 700; }
  .amt-plus  { color: var(--text);  font-weight: 700; }

  /* 4. 白い半透明カード（円の下半分に重なる） */
  .panel {
    position: relative; z-index: 1;
    margin: -12px 4px 0; padding: 21px 4px 7px;
    border-radius: 24px;
    background: var(--card);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgba(255,255,255,.55) inset;
  }
  .perks { display: flex; gap: 16px; padding: 0 0 22px 16px; font-size: 15.5px; white-space: nowrap; }
  .perks .lbl { color: var(--sub); margin-right: 8px; }
  .perks .cnt { color: var(--text); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .action {
    height: 48px; border-radius: 14px; background: var(--tile);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    font-size: 16px; font-weight: 700; text-align: left;
  }
  .action svg { width: 24px; height: 24px; flex: none; }
  .action:active, .deposit:active { background: #F3F5F8; }
  .deposit {
    width: 100%; margin-top: 4px; padding: 21px 26px 21px 16px; border-radius: 16px; background: var(--tile);
    display: flex; align-items: center; text-align: left;
  }
  .deposit .body { flex: 1; }
  .deposit .ttl { color: var(--sub); font-size: 15px; }
  .deposit .bal { font-weight: 800; line-height: 1.3; }
  .deposit .bal .v { font-size: 18px; }
  .deposit .bal .u { font-size: 13px; font-weight: 700; margin-left: 1px; }
  .deposit .diff { font-size: 15px; margin-top: 0; }
  .deposit .diff .lbl { color: var(--sub); }
  .deposit svg { width: 22px; height: 22px; color: var(--line); }

  /* 5. 表示内容とご注意 */
  .notice {
    margin: 32px 0 0 24px; height: 32px; padding: 0 14px;
    border: 1.5px solid #4B5563; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500;
  }
  .notice svg { width: 14px; height: 14px; color: var(--sub); }

  /* 6. タブバー */
  .tabbar {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 100%; max-width: 430px; z-index: 5;
    background: #fff; border-top: 1px solid #E5E7EB;
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 17px 0 calc(40px + env(safe-area-inset-bottom));
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #2B2F36; min-height: 48px; }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { font-weight: 500; }
  .tab .on, .tab.active .off { display: none; }
  .tab.active .on { display: block; }

  .masked { letter-spacing: .08em; }
  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 12px);
    background: rgba(31,35,40,.9); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 999px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 1. ヘッダー -->
  <header class="header">
    <div class="stage">
      <svg viewBox="0 0 26 26" aria-hidden="true">
        <defs><linearGradient id="dia" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9DDE3"/><stop offset="1" stop-color="#A9B0BA"/></linearGradient></defs>
        <rect x="5" y="5" width="16" height="16" rx="2.5" transform="rotate(45 13 13)" fill="url(#dia)"/>
        <rect x="8.5" y="8.5" width="9" height="9" rx="1.2" transform="rotate(45 13 13)" fill="#C3C8CF" stroke="#E9ECF0" stroke-width="1"/>
      </svg>
      <span id="stage">ステージなし</span>
    </div>
    <div class="head-icons">
      <button class="icon-btn" data-action="account" aria-label="アカウント">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9.5" r="3.4"/><path d="M5.6 18.6c1.5-2.4 3.8-3.6 6.4-3.6s4.9 1.2 6.4 3.6"/></svg>
      </button>
      <button class="icon-btn" data-action="notice-bell" aria-label="お知らせ">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2H4.5z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M12 3v2"/></svg>
      </button>
    </div>
  </header>

  <!-- 2. サブヘッダー -->
  <div class="subhead">
    <button id="toggleAmount" aria-pressed="true" aria-label="金額表示の切替">
      <span>金額表示</span>
      <svg id="eyeIcon" viewBox="0 0 24 24"></svg>
    </button>
    <button class="refresh" id="refreshBtn" aria-label="更新">
      <span id="updatedAt" class="num"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"><path d="M19.5 9A8 8 0 0 0 5 7.5"/><path d="M5 3.5v4h4"/><path d="M4.5 15A8 8 0 0 0 19 16.5"/><path d="M19 20.5v-4h-4"/></svg>
    </button>
  </div>

  <!-- 3. 残高エリア -->
  <section class="hero">
    <div class="orb"></div>
    <div class="hero-text">
      <div class="branch num" id="branch"></div>
      <div class="balance num"><span class="v" data-amount="balance"></span><span class="u">円</span></div>
      <div class="diff num"><span class="lbl">前月末比</span><span data-diff="prevMonthDiff"></span></div>
    </div>
  </section>

  <!-- 4. カード -->
  <section class="panel">
    <div class="perks">
      <span><span class="lbl">振込手数料無料</span><span class="cnt num">残り<span id="freeTransfer"></span>回</span></span>
      <span><span class="lbl">ATM無料</span><span class="cnt num">残り<span id="freeAtm"></span>回</span></span>
    </div>
    <div class="actions">
      <button class="action" data-action="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5A8 8 0 0 0 5.2 6.8"/><path d="M4 11.5a8 8 0 0 0 1.2 3.8"/><path d="M12 20a8 8 0 0 0 7.6-5.5"/><path d="M9 17h6"/><path d="M12.5 14.5 15 17l-2.5 2.5"/><path d="M15 21h-6"/><path d="M11.5 18.5 9 21l2.5 2.5"/></svg>
        入出金履歴
      </button>
      <button class="action" data-action="atm">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linejoin="round"><path d="M4 3.5h16v4H4z"/><path d="M6 7.5v13h12v-13"/><path d="M9.5 10l2.5 3.2 2.5-3.2M12 13.2V18M9.8 14.6h4.4M9.8 16.4h4.4" stroke-linecap="round"/></svg>
        スマホATM
      </button>
    </div>
    <button class="deposit" data-action="deposit" aria-label="円預金の明細へ">
      <div class="body">
        <div class="ttl">円預金</div>
        <div class="bal num"><span class="v" data-amount="balance"></span><span class="u">円</span></div>
        <div class="diff num"><span class="lbl">前月末比</span><span data-diff="prevMonthDiff"></span></div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </section>

  <!-- 5. 表示内容とご注意 -->
  <button class="notice" data-action="notice">
    表示内容とご注意
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4"/><path d="M13.5 2.5 7.5 8.5"/><path d="M12 9.5v3.5a.5.5 0 0 1-.5.5h-8.5a.5.5 0 0 1-.5-.5v-8.5a.5.5 0 0 1 .5-.5h3.5"/></svg>
  </button>
</div>

<!-- 6. タブバー -->
<nav class="tabbar" id="tabbar">
  <!-- 各タブに線画(.off)と黒塗り(.on)の2つのアイコン。選択中(.active)は黒塗りを出す -->
  <button class="tab active" data-tab="assets">
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M8.6 6.8 12 11.2l3.4-4.4M12 11.2V17.6M9.2 12.6h5.6M9.2 15h5.6"/></svg>
    <svg class="on" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#1F2328"/><path d="M8.6 6.8 12 11.2l3.4-4.4M12 11.2V17.6M9.2 12.6h5.6M9.2 15h5.6" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
    資産
  </button>
  <button class="tab" data-tab="fx">
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6.5c3 1.2 6-1 9 0s6 1.2 9 0v11c-3 1.2-6-1-9 0s-6-1.2-9 0z"/><circle cx="12" cy="12" r="2"/></svg>
    <svg class="on" viewBox="0 0 24 24"><path d="M2.2 5.6c3.3 1.3 6.5-1.1 9.8 0s6.5 1.3 9.8 0v12.8c-3.3 1.3-6.5-1.1-9.8 0s-6.5-1.3-9.8 0z" fill="#1F2328"/><circle cx="12" cy="12" r="2.3" fill="none" stroke="#fff" stroke-width="1.6"/></svg>
    外貨取引
  </button>
  <button class="tab" data-tab="transfer">
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8.5 15.5l7-7M10 8.5h5.5V14"/></svg>
    <svg class="on" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#1F2328"/><path d="M8.5 15.5l7-7M10 8.5h5.5V14" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    振込
  </button>
  <button class="tab" data-tab="campaign">
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linejoin="round"><path d="M4 9h16v3.5H4zM5.5 12.5h13V21h-13zM12 9v12"/><path d="M12 9c-1.5-3.5-5-4-5-1.5S10 9 12 9zm0 0c1.5-3.5 5-4 5-1.5S14 9 12 9z"/></svg>
    <svg class="on" viewBox="0 0 24 24"><path d="M12 9c-1.5-3.5-5-4-5-1.5S10 9 12 9zm0 0c1.5-3.5 5-4 5-1.5S14 9 12 9z" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linejoin="round"/><rect x="3.2" y="8.2" width="17.6" height="5" rx=".6" fill="#1F2328"/><rect x="4.8" y="12.4" width="14.4" height="9.4" rx=".6" fill="#1F2328"/><path d="M12 8.2v13.6M3.2 13.2h17.6" stroke="#fff" stroke-width="1.4"/></svg>
    キャンペーン
  </button>
  <button class="tab" data-tab="transactions">
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="1.6" stroke-linejoin="round"><path d="M5.5 3h13v18h-13z"/><path d="M8.5 7.5h7M8.5 11h7M8.5 14.5h7M8.5 18h4" stroke-linecap="round"/></svg>
    <svg class="on" viewBox="0 0 24 24"><rect x="4.7" y="2.2" width="14.6" height="19.6" rx="1" fill="#1F2328"/><path d="M8.5 7.5h7M8.5 11h7M8.5 14.5h7M8.5 18h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    取引一覧
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ===== データ層 =====
   画面は renderHome(props) だけで描く。値は API（RiniiApi.fetchHome）から受け取る。
   本番 API ができたら RiniiApi.endpoint に URL を入れれば、同じ形の JSON を fetch して使う。 */
const MOCK_HOME = {
  stage: 'ステージなし',
  branchName: '本店営業部',
  branchCode: '001',
  accountNumber: '1234567',           // ダミー
  balance: 12480,
  prevMonthDiff: -667,
  freeTransferLeft: 1,
  freeAtmLeft: 1,
  updatedAt: '2026-11-11T23:33:00+09:00',
  noticeUrl: 'https://example.com/rinii/notice',
};

const RiniiApi = {
  endpoint: null,   // 例: 'https://api.example.com/home'
  async fetchHome() {
    if (this.endpoint) {
      const r = await fetch(this.endpoint, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }
    await new Promise((res) => setTimeout(res, 500));   // 通信のふり
    return { ...MOCK_HOME };
  },
};

/* ===== 表示 ===== */
const state = { props: MOCK_HOME, showAmount: true };

const yen = (n) => Math.abs(n).toLocaleString('ja-JP');
const signed = (n) => (n < 0 ? '-' : n > 0 ? '+' : '') + yen(n) + '円';

function fmtUpdated(iso) {
  const d = new Date(iso);
  const p = (x) => String(x).padStart(2, '0');
  // 日本時間で表示
  const j = new Date(d.getTime() + (9 * 60 + d.getTimezoneOffset()) * 60000);
  return `${j.getFullYear()}年${j.getMonth() + 1}月${j.getDate()}日 ${p(j.getHours())}:${p(j.getMinutes())} 更新`;
}

const EYE_OPEN = '<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z" fill="none" stroke="#6B7280" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="#6B7280"/>';
const EYE_OFF  = '<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z" fill="none" stroke="#6B7280" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="#6B7280"/><path d="M4 4l16 16" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/>';

function renderHome(props) {
  state.props = props;
  const show = state.showAmount;
  document.getElementById('stage').textContent = props.stage;
  document.getElementById('branch').textContent = `${props.branchName}（${props.branchCode}）${props.accountNumber}`;
  document.getElementById('freeTransfer').textContent = props.freeTransferLeft;
  document.getElementById('freeAtm').textContent = props.freeAtmLeft;
  document.getElementById('updatedAt').textContent = fmtUpdated(props.updatedAt);

  document.querySelectorAll('[data-amount]').forEach((el) => {
    el.textContent = show ? yen(props[el.dataset.amount]) : '****';
    el.classList.toggle('masked', !show);
  });
  document.querySelectorAll('[data-diff]').forEach((el) => {
    const v = props[el.dataset.diff];
    el.textContent = show ? signed(v) : '****円';
    el.className = show && v < 0 ? 'amt-minus' : 'amt-plus';
  });
  document.getElementById('eyeIcon').innerHTML = show ? EYE_OPEN : EYE_OFF;
  document.getElementById('toggleAmount').setAttribute('aria-pressed', String(show));
}

/* ===== 操作 ===== */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// 遷移先は仮。画面ができたら location.href を差し替える
const ROUTES = {
  account: 'アカウント（仮）',
  'notice-bell': 'お知らせ（仮）',
  history: '入出金履歴（仮）',
  atm: 'スマホATM（仮）',
  deposit: '円預金の明細（仮）',
};

document.getElementById('toggleAmount').addEventListener('click', () => {
  state.showAmount = !state.showAmount;
  renderHome(state.props);
});

let refreshing = false;
document.getElementById('refreshBtn').addEventListener('click', async (e) => {
  if (refreshing) return;
  refreshing = true;
  const btn = e.currentTarget;
  btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
  try {
    const data = await RiniiApi.fetchHome();
    data.updatedAt = new Date().toISOString();   // 再取得した時刻を表示
    renderHome(data);
    toast('最新の情報に更新しました');
  } catch (err) {
    toast('更新できませんでした');
  } finally {
    refreshing = false;
    setTimeout(() => btn.classList.remove('spin'), 650);
  }
});

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-action]');
  if (a) {
    const k = a.dataset.action;
    if (k === 'notice') { window.open(state.props.noticeUrl, '_blank', 'noopener'); return; }
    toast(ROUTES[k] + 'へ移動します');
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
    if (tab.dataset.tab !== 'assets') toast(tab.textContent.trim() + '（仮）');
  }
});

/* 初期表示：モックで描いてから API で取り直す */
renderHome(MOCK_HOME);
RiniiApi.fetchHome().then(renderHome).catch(() => {});
</script>
</body>
</html>
